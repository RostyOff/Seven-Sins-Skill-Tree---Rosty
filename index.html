<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Seven Sins Skill Tree</title>

<style>
body{
    background:#0b0b0b;
    color:white;
    font-family:Arial;
    padding:40px;
}

.tree{
    display:flex;
    justify-content:space-between;
}

.sin{
    text-align:center;
    width:140px;
    position:relative;
}

.sin-title{
    width:110px;
    height:110px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 30px;
    font-weight:bold;
    position:relative;
    overflow:hidden;
    border:2px solid currentColor;
}

.sin-title::after{
    content:"";
    position:absolute;
    inset:-20px;
    background:radial-gradient(circle, currentColor 10%, transparent 60%);
    opacity:0.25;
    animation:smoke 6s infinite alternate;
}

@keyframes smoke{
    from{transform:translateX(-15px);}
    to{transform:translateX(15px);}
}

/* ÇİZGİ */
.line{
    position:absolute;
    left:50%;
    width:3px;
    background:linear-gradient(
        to bottom,
        rgba(255,255,255,0.9),
        rgba(255,255,255,0.2)
    );
    box-shadow:0 0 10px rgba(255,255,255,0.6);
    transform:translateX(-50%);
    border-radius:3px;
}

/* SKILL */
.skill{
    width:22px;
    height:22px;
    border-radius:50%;
    margin:35px auto;
    cursor:pointer;
    transition:0.3s;
    position:relative;
    z-index:2;
}

.skill:hover{
    transform:scale(1.4);
    box-shadow:0 0 15px currentColor;
}

/* ALT AÇIKLAMA */
#desc{
    margin-top:40px;
    padding:20px;
    min-height:80px;
    border-radius:10px;
    background:rgba(255,255,255,0.05);
    transition:0.5s;
    position:relative;
    overflow:hidden;
}

#desc::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 65%);
    animation:smoke 8s infinite alternate;
}
</style>
</head>

<body>

<script>
function showSkill(title,text,color){
    const d=document.getElementById("desc");
